<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background: rounded dark square -->
  <rect width="64" height="64" rx="14" fill="#060606"/>

  <!-- Subtle border for definition on dark backgrounds -->
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- "l" letterform — vertical bar with a slight serif foot -->
  <path d="M16 12 L16 44 L26 44 L26 40 L22 40 L22 12 Z" fill="#00e599"/>

  <!-- "p" letterform — vertical bar + bowl -->
  <path d="M30 20 L30 52 L36 52 L36 42 Q36 36 42 36 Q48 36 48 30 Q48 24 42 24 L36 24 L36 20 Z M36 28 L40 28 Q43 28 43 30 Q43 32 40 32 L36 32 Z" fill="#f0ece3"/>

  <!-- Accent dot — the "press" indicator -->
  <circle cx="51" cy="48" r="4" fill="#00e599"/>
</svg>
